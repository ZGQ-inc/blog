# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: ZGQ Blog
subtitle: Serverless · Liquid Glass · Edge Computing
description: A serverless blog & forum system powered by Cloudflare Pages, Workers, D1 — with Telegram bi-directional sync and Liquid Glass UI.
keywords: serverless, blog, cloudflare, worker, d1, telegram, liquid-glass
author: ZGQ
language: zh-CN
timezone: 'Asia/Shanghai'

# Telegram Channel (used in templates)
telegram_channel: your_telegram_channel_username

# GitHub (used for GitOps — also set GITHUB_OWNER/GITHUB_REPO in wrangler.toml)
github_owner: YOUR_GITHUB_USERNAME
github_repo: YOUR_GITHUB_REPO

# URL — replace with your actual Cloudflare Pages domain
url: https://zgq.blog
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: false
  trailing_html: false

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang

# Skip rendering for admin panel and forum (served as raw HTML)
skip_render:
  - admin/**
  - forum/**

# Writing
new_post_name: :year-:month-:day-:title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  line_number: true
  auto_detect: true
  tab_replace: '  '
prismjs:
  enable: false

# markdown-it configuration
markdown:
  preset: 'default'
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: true

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: 'mtime'

# Pagination
per_page: 9
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: serverless

# Deployment
deploy:
  type: ''
