---
title: TG 讨论区
layout: false
---
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TG 讨论区 | <%= config.title %></title>
  <meta name="description" content="Telegram 讨论区 — 实时同步 Telegram 群组的讨论内容">
  
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet">

  <script type="importmap">
    {
      "imports": {
        "@material/web/": "https://esm.run/@material/web/"
      }
    }
  </script>
  <script type="module">
      import '@material/web/all.js';
  </script>

  <link rel="stylesheet" href="/css/m3-glassmorphism.css">
</head>
<body>

  <!-- Minimal nav header -->
  <div class="top-sticky-area">
    <header>
      <div class="header-title-group">
        <h1><a href="/"><%= config.title %></a></h1>
        <div class="header-pill">
          <span class="native-icon" style="font-size:14px;color:var(--md-sys-color-primary);">forum</span>
          <span style="font-size:12px;opacity:0.8;">讨论区</span>
        </div>
      </div>
      <div class="header-actions">
        <span class="live-dot" style="width:8px;height:8px;background:green;border-radius:50%;display:inline-block;" title="实时同步中"></span>
        <md-icon-button aria-label="刷新" onclick="loadDiscussions()">
          <md-icon>refresh</md-icon>
        </md-icon-button>
        <md-icon-button href="/" aria-label="返回主页">
          <md-icon>close</md-icon>
        </md-icon-button>
      </div>
    </header>
  </div>

  <div class="container fade-in-up">
    <!-- Forum header card -->
    <div class="post-wrapper" style="text-align:center;margin-bottom:32px;">
      <span class="native-icon" style="font-size:3rem;color:var(--md-sys-color-primary);margin-bottom:12px;">forum</span>
      <h1 style="font-size:1.8rem;font-weight:700;margin:0 0 8px;color:var(--md-sys-color-on-surface);">Telegram 讨论区</h1>
      <p style="opacity:0.7;margin:0 0 16px;">来自 Telegram 群组的实时讨论，通过 Cloudflare D1 双向同步</p>
      
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap;">
        <% if (config.telegram_channel) { %>
          <md-filled-button href="https://t.me/<%= config.telegram_channel %>" target="_blank">
            <md-icon slot="icon">send</md-icon>加入 Telegram 群组
          </md-filled-button>
        <% } %>
        <div class="native-chip" style="background:var(--md-sys-color-secondary-container);color:var(--md-sys-color-on-secondary-container);padding:0 16px;height:40px;border-radius:20px;font-size:0.9rem;">
          <span class="native-icon" style="margin-right:6px;">sync</span>
          实时同步
        </div>
      </div>
    </div>

    <!-- Discussion filter tabs -->
    <div class="filter-section" style="margin-bottom:24px;">
      <div class="filter-pool-container" id="filter-tabs">
        <div class="custom-m3-chip chip-and" onclick="filterDiscussions('all', this)">全部讨论</div>
        <div class="custom-m3-chip" onclick="filterDiscussions('blog', this)">博客评论</div>
        <div class="custom-m3-chip" onclick="filterDiscussions('general', this)">自由讨论</div>
      </div>
    </div>

    <div id="discussion-list" style="margin-top:16px;"></div>

    <!-- Loading skeleton -->
    <div id="forum-loading" style="display:none;">
      <div class="forum-item" style="height:80px;opacity:0.5;animation:pulse 1.5s infinite;">加载中...</div>
    </div>

    <!-- Empty state -->
    <div id="forum-empty" class="post-wrapper" style="display:none;text-align:center;padding:64px;opacity:0.5;">
      <span class="native-icon" style="font-size:3rem;display:block;margin-bottom:16px;">inbox</span>
      <p>暂无讨论内容</p>
    </div>
  </div>

  <script>
    let allDiscussions = [];

    async function loadDiscussions() {
      const loadingEl = document.getElementById('forum-loading');
      loadingEl.style.display = 'block';
      document.getElementById('discussion-list').innerHTML = '';

      try {
        const res = await fetch('/api/twikoo', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ event: 'GET_COMMENTS', post_slug: 'telegram-general-discussion' })
        });
        const { data } = await res.json();
        allDiscussions = data || [];
        // Re-apply current filter
        const activeTab = document.querySelector('#filter-tabs .chip-and');
        if (activeTab) {
          activeTab.click();
        } else {
          filterDiscussions('all', document.querySelector('#filter-tabs .custom-m3-chip'));
        }
      } catch (err) {
        document.getElementById('discussion-list').innerHTML =
          '<p style="text-align:center;opacity:0.5;">加载失败，请稍后刷新</p>';
      } finally {
        loadingEl.style.display = 'none';
      }
    }

    function filterDiscussions(tab, el) {
      // Update UI
      if (el) {
        document.querySelectorAll('#filter-tabs .custom-m3-chip').forEach(c => c.classList.remove('chip-and'));
        el.classList.add('chip-and');
      }

      let items = allDiscussions;
      if (tab === 'blog') {
        items = allDiscussions.filter(d => d.post_slug !== 'telegram-general-discussion');
      } else if (tab === 'general') {
        items = allDiscussions.filter(d => d.post_slug === 'telegram-general-discussion');
      }

      const listEl = document.getElementById('discussion-list');
      const emptyEl = document.getElementById('forum-empty');

      if (!items.length) {
        listEl.innerHTML = '';
        emptyEl.style.display = 'block';
        return;
      }

      emptyEl.style.display = 'none';
      listEl.innerHTML = items.slice(0, 50).map(item => {
        const initials = (item.author_name || '?').charAt(0).toUpperCase();
        const dateStr = new Date(item.created_at * 1000).toLocaleString('zh-CN',
          { month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit' });
        const isGeneral = item.post_slug === 'telegram-general-discussion';
        return `
          <div class="forum-item" style="display:flex; gap:16px;">
            <div style="width:40px;height:40px;border-radius:50%;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);display:flex;align-items:center;justify-content:center;font-weight:bold;flex-shrink:0;">${initials}</div>
            <div style="flex:1;min-width:0;">
              <div style="font-weight:600;font-size:0.9rem;margin-bottom:4px;color:var(--md-sys-color-on-surface);">
                ${escHtml(item.author_name)}
                ${item.is_admin ? '<span class="native-chip" style="font-size:10px;padding:2px 4px;margin-left:4px;background:var(--md-sys-color-error-container);color:var(--md-sys-color-on-error-container);">博主</span>' : ''}
              </div>
              <div style="font-size:0.9rem;opacity:0.9;color:var(--md-sys-color-on-surface);margin-bottom:8px;">
                ${item.content.replace(/<[^>]+>/g, '').slice(0, 120)}
              </div>
              ${!isGeneral ? `
                <div style="margin-top:6px;">
                  <a href="/${item.post_slug}" class="native-chip">
                    <span class="native-icon" style="font-size:12px;margin-right:4px;">article</span>
                    ${item.post_slug}
                  </a>
                </div>
              ` : ''}
            </div>
            <div style="text-align:right;font-size:0.78rem;opacity:0.5;flex-shrink:0;color:var(--md-sys-color-on-surface-variant);">
              ${dateStr}
              ${item.tg_message_id ? `<br><span class="native-icon" style="font-size:12px;vertical-align:middle;opacity:0.7;">send</span>` : ''}
            </div>
          </div>
        `;
      }).join('');
    }

    function escHtml(str) {
      return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    loadDiscussions();
    setInterval(loadDiscussions, 30000);
  </script>
</body>
</html>
